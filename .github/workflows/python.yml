name: Python package

# Tests theideaplace-appkit (python/) on the platforms its apps run on.

on:
  pull_request:
    paths:
      - 'python/**'
      - 'sounds/**'
      - '.github/workflows/python.yml'
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'sounds/**'
      - '.github/workflows/python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ['3.9', '3.12']
        exclude:
          # Ubuntu 26.04 has no Python 3.9. Linux apps use the distribution's newer one.
          - os: ubuntu-latest
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install pytest cryptography "./python[gallery]"
      - name: Test
        working-directory: python
        run: python -W error -m pytest -q tests
      - name: The sounds are as generated, with no clicks
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        working-directory: sounds
        run: |
          python generate.py .
          git diff --exit-code -- '*.wav'
          test -z "$(git status --porcelain -- '*.wav')"
          python measure.py .
