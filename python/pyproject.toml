[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "theideaplace-appkit"
version = "0.3.0"
description = "Shared pieces for The Idea Place's wxPython apps."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# Checking the sound gallery's signature (soundgallery.verify).
gallery = ["pycryptodomex>=3.20"]

[tool.setuptools]
packages = ["theideaplace_appkit"]

[tool.setuptools.package-data]
theideaplace_appkit = ["apps.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Test coverage, for the weekly Coverage workflow (#41) and for `pytest --cov` by hand from this
# folder. relative_files and [paths] let the Windows, macOS and Linux runs be combined into one
# report. The package only: the tests aren't measured.
[tool.coverage.run]
source = ["theideaplace_appkit"]
branch = true
relative_files = true

[tool.coverage.paths]
source = [
    "theideaplace_appkit/",
    "theideaplace_appkit\\",
]
